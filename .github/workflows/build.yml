name: build-binaries

# 触发方式：
#   - push 到 main
#   - 打 v* 标签（准备发布）
#   - 手动触发（Actions 页面 "Run workflow"）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Windows arm64 需要交叉编译工具链，标记为实验性：失败不阻塞其他产物
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,   platform: windows, arch: x64,   experimental: false }
          - { name: windows-arm64, os: windows-latest,   platform: windows, arch: arm64, experimental: true  }
          - { name: macos-x64,     os: macos-13,         platform: macosx,  arch: x64,   experimental: false }
          - { name: macos-arm64,   os: macos-14,         platform: macosx,  arch: arm64, experimental: false }
          - { name: linux-x64,     os: ubuntu-latest,    platform: linux,   arch: x64,   experimental: false }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, platform: linux,   arch: arm64, experimental: false }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: 安装 clang（Windows 使用，避免 MSVC 对 C11 复合字面量的限制）
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: 拉取 PDCurses 源码（Windows 终端控制后端）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p deps
          curl -fsSL https://github.com/wmcbrine/PDCurses/archive/refs/tags/3.9.tar.gz | tar -xz -C deps
          mv deps/PDCurses-3.9 deps/pdcurses

      - name: 配置并构建
        shell: bash
        run: |
          xmake f -y -m release -p ${{ matrix.platform }} -a ${{ matrix.arch }}
          xmake -y

      - name: 收集二进制产物
        shell: bash
        run: |
          mkdir -p dist
          BIN="$(find build -type f \( -name 'lobby' -o -name 'lobby.exe' \) -print -quit)"
          if [ -z "$BIN" ]; then
            echo "未找到构建产物"
            exit 1
          fi
          cp "$BIN" dist/
          echo "已收集: $(basename "$BIN")"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ds-crt-arcade-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # 打 v* 标签（如 v1.0.0）时：汇总全部矩阵产物，发布到 GitHub Releases
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 重命名并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p staging
          NOTES="## 构建产物\n\n"
          for d in artifacts/*/; do
            name="$(basename "$d")"
            name="${name#ds-crt-arcade-}"   # 去掉 upload-artifact 前缀
            bin="$(find "$d" -maxdepth 1 -type f -name 'lobby*' -print -quit)"
            [ -z "$bin" ] && continue
            ext=""
            case "$name" in *windows*) ext=".exe";; esac
            cp "$bin" "staging/ds-crt-arcade-${name}${ext}"
            NOTES="${NOTES}- \`ds-crt-arcade-${name}${ext}\`\n"
          done
          if [ -z "$(ls -A staging)" ]; then
            echo "没有可发布的产物，跳过"
            exit 1
          fi
          printf '%b' "$NOTES" > notes.md
          printf '%s\n' '' '## 运行说明' '' '- Linux / macOS：下载后先 `chmod +x`，再 `./ds-crt-arcade-*` 运行' '- Windows：建议用 Windows Terminal 运行（传统 cmd 控制台对宽字符渲染有限）' >> notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ds-crt-arcade ${TAG}" \
            --notes-file notes.md \
            staging/*
